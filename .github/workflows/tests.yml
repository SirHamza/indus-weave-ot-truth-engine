# Runs the unit tests on every push and pull request.
# The tests build their own tiny data, so the raw HCM files are not needed here.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "pandas>=2.2" "numpy>=1.26" "pytest>=8"
      - name: Run unit tests
        run: python -m pytest tests -v
